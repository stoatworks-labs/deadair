    <noscript>
      <h1>Dead Air</h1>
      <p>Strip silence, then hand the cut to Resolve.</p>
      <p>Drop in a recording, set a threshold and a minimum gap, and watch the silences shade red on a loudness waveform. Out comes a cut-list EDL that DaVinci Resolve imports as the ripple-deleted timeline, a marker EDL so you can review the silences before cutting anything, an FCPXML for Premiere and Final Cut, a CSV and an ffmpeg command. Or it'll make the cut file itself, rendered in the browser with the browser's own hardware H.264 and AAC codecs and streamed straight to disk. It reads the frame rate and start timecode from the file's own timecode track, and the whole thing runs in the browser.</p>
      <p>Dead Air runs in the browser and needs JavaScript.</p>
      <ul>
        <li><a href="https://stoatworks-labs.com/software/deadair/">Dead Air on stoatworks-labs.com</a></li>

      </ul>
    </noscript>
