<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Dead Air — strip silence for DaVinci Resolve</title>
    <meta
      name="description"
      content="Find the silences in a recording and hand DaVinci Resolve a cut-list EDL, a marker list or an FCPXML — or cut the file directly with a generated ffmpeg command. Runs entirely in your browser."
    />

    <link rel="canonical" href="https://deadair.stoatworks-labs.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://deadair.stoatworks-labs.com/" />
    <meta property="og:site_name" content="Stoatworks Labs" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:title" content="Dead Air — strip silence for DaVinci Resolve" />
    <meta
      property="og:description"
      content="Find the silences in a recording and hand DaVinci Resolve a cut-list EDL, a marker list or an FCPXML — or cut the file directly with a generated ffmpeg command. Runs entirely in your browser."
    />
    <!-- Card hosted on the main site: regenerated in place by the website's
         make_thumbnails.py and keeps its filename. -->
    <meta property="og:image" content="https://stoatworks-labs.com/thumbs/deadair.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://stoatworks-labs.com/thumbs/deadair.png" />
    <meta name="theme-color" content="#0d1b2a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS ignores the manifest's icons entirely and wants a PNG of its own. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      About dialog. Both files are vendored from stoatworks-backend/about and
      generated by its sync-about.py — edit them there, never here. Classic +
      defer: about-data.js only sets defaults, so it and the app's own startup
      can load in either order.
    -->
    <script src="/about-data.js" defer></script>
    <script src="/about.js" defer></script>
    <!--
      Support footer. Vendored from stoatworks-backend/support-footer — edit it
      there and re-run the sync, never here. Classic + defer on purpose: it reads
      its config off this tag, and document.currentScript is null in a module.
    -->
    <script
      src="/support-footer.js"
      defer
      data-app="Dead Air"
      data-repo="https://github.com/stoatworks-labs/deadair"
      data-note="It runs entirely in your browser — no account, and the recording you drop is never uploaded."
    ></script>
  </body>
</html>
